<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t = localStorage.getItem('kdar-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KDAR — 한인 아나키즘 운동사 계보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"]{
  --bg:#f7f3ea;
  --bg-2:#efe8d8;
  --surface:#fffdf7;
  --surface-2:#f4eede;
  --text:#241d14;
  --line-col:#c8b98e;
  --red:#9c3324;
  --red-bright:#b53a26;
  --indigo:#33495a;
  --gold:#a9812f;
  --muted:#83745a;
  --line-dim: rgba(36,29,20,0.07);
  --line-mid: rgba(36,29,20,0.15);
  --glow-1: rgba(156,51,36,0.07);
  --glow-2: rgba(51,73,90,0.08);
  --shadow: rgba(60,45,20,0.22);
  --lane-tint: rgba(36,29,20,0.03);
  --lane-tint-alt: rgba(36,29,20,0.055);
  --on-accent: #fdf8ee;
}
:root[data-theme="dark"]{
  --bg:#17181a;
  --bg-2:#1c1d20;
  --surface:#232426;
  --surface-2:#2a2b2e;
  --text:#e9e8e4;
  --line-col:#43454a;
  --red:#e0563a;
  --red-bright:#ef6a4c;
  --indigo:#7d9bb5;
  --gold:#d3ab5c;
  --muted:#93959c;
  --line-dim: rgba(233,233,235,0.06);
  --line-mid: rgba(233,233,235,0.13);
  --glow-1: rgba(224,86,58,0.08);
  --glow-2: rgba(125,155,181,0.09);
  --shadow: rgba(0,0,0,0.5);
  --lane-tint: rgba(255,255,255,0.025);
  --lane-tint-alt: rgba(255,255,255,0.05);
  --on-accent: #fdf8ee;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif KR',serif;overflow:hidden;}
body{
  background-image:
    radial-gradient(ellipse at 15% -10%, var(--glow-1), transparent 45%),
    radial-gradient(ellipse at 90% 110%, var(--glow-2), transparent 50%);
  transition:background-color .2s ease, color .2s ease;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ---------- Header ---------- */
header{
  position:relative;
  padding:18px 22px 14px;
  border-bottom:1px solid var(--line-mid);
  display:flex; align-items:flex-end; justify-content:space-between; gap:18px;
  flex-wrap:wrap;
  background:linear-gradient(180deg, var(--bg-2), var(--bg));
  z-index:20;
}
.title-block{display:flex; align-items:center; gap:16px;}
.seal{
  width:46px;height:46px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.seal img{width:100%;height:100%;object-fit:contain;display:block;}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;line-height:1.25;}
h1 small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.12em;margin-top:3px;}
.stats{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;}
.stats b{color:var(--text);font-weight:600;}

.controls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#search{
  background:var(--bg-2); border:1px solid var(--line-col); color:var(--text);
  font-family:'Noto Serif KR',serif; font-size:13px; padding:7px 11px; border-radius:2px;
  width:200px; outline:none;
}
#search::placeholder{color:var(--muted);}
#search:focus{border-color:var(--gold);}
.btn{
  background:transparent;border:1px solid var(--line-col); color:var(--text);
  font-family:'JetBrains Mono',monospace; font-size:12px; padding:7px 10px; border-radius:2px;
  cursor:pointer; line-height:1;
}
.btn:hover{border-color:var(--gold); color:var(--gold);}
.btn.active{background:var(--red); border-color:var(--red); color:var(--on-accent);}
#theme-toggle{font-size:15px; width:34px; height:32px; display:flex; align-items:center; justify-content:center; padding:0; flex:none;}

/* ---------- Stage ---------- */
#stage{position:relative; flex:1; min-height:0; overflow:hidden; cursor:grab;}
#stage.grabbing{cursor:grabbing;}
#main-svg{position:absolute; inset:0; bottom:46px; width:100%; height:calc(100% - 46px); display:block; touch-action:none;}
#axis-svg{position:absolute; left:0; right:0; bottom:0; height:46px; width:100%; display:block;
  background:linear-gradient(180deg, var(--bg-2), var(--bg) 40%); border-top:1px solid var(--line-mid); pointer-events:none;}
.axis-tick text{fill:var(--muted); font-family:'JetBrains Mono',monospace;}
.axis-tick.major text{fill:var(--gold); font-weight:600;}
.axis-tick line{stroke:var(--line-mid);}
.axis-tick.major line{stroke:var(--gold); opacity:.5;}

.gridline{stroke:var(--line-dim); vector-effect:non-scaling-stroke;}
.gridline.major{stroke:var(--line-mid);}

.lane-band{fill:var(--lane-tint);}
.lane-band.alt{fill:var(--lane-tint-alt);}

.node rect.card{
  fill:var(--surface); stroke:var(--line-col); stroke-width:1.1; vector-effect:non-scaling-stroke;
  transition:filter .15s ease, width .12s ease, height .12s ease, y .12s ease;
}
.node .accent{fill:var(--red-bright); transition:width .12s ease, height .12s ease, y .12s ease;}
.node.uncertain rect.card{stroke-dasharray:4 3;}
.node:hover rect.card, .node.active rect.card{stroke:var(--gold); stroke-width:1.6;}
.node:hover .accent, .node.active .accent{fill:var(--gold);}
.node.dimmed{opacity:.16;}
.node.highlight rect.card{stroke:var(--red-bright); stroke-width:2;}
.node{cursor:pointer;}
.node.expanded rect.card{stroke:var(--gold); stroke-width:1.8; filter:drop-shadow(0 6px 14px var(--shadow));}
.node.expanded{opacity:1 !important;}
.node-fo{pointer-events:none; transition:width .12s ease, height .12s ease, y .12s ease;}
.node-label{
  font-family:'Noto Serif KR',serif; color:var(--text); font-size:11px; font-weight:600;
  line-height:1.24; padding:3px 5px 2px 8px; height:100%; width:100%;
  display:flex; align-items:center; overflow:hidden;
}
.node-label span{
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  word-break:keep-all;
}

.edge{fill:none; stroke-width:1.6; vector-effect:non-scaling-stroke;}
.edge.succession{stroke:var(--gold); opacity:.85;}
.edge.split{stroke:#7f9b6b; opacity:.85;}
.edge.merge{stroke:var(--indigo); opacity:.9;}
.edge.complex{stroke:#7f9b6b; opacity:.85;}
.edge.dormant{stroke:var(--muted); stroke-dasharray:1 4; opacity:.8;}
.edge.uncertain{stroke:var(--red-bright); stroke-dasharray:2 3; opacity:.8;}
.edge.edge-dimmed{opacity:.06;}
.edge.edge-highlight{opacity:1; stroke-width:2.4;}

/* ---------- Tooltip / detail panel ---------- */
#tooltip{
  position:fixed; z-index:100; max-width:360px;
  background:var(--surface-2); color:var(--text); border:1px solid var(--line-col);
  border-left:4px solid var(--red-bright);
  box-shadow:0 12px 28px var(--shadow);
  padding:14px 16px 16px; border-radius:2px;
  display:none;
}
#tooltip.visible{display:block;}
#tooltip h3{margin:0 0 2px; font-size:15px; font-weight:700; line-height:1.35; white-space:pre-line;}
#tooltip .period{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--red); margin-bottom:9px; font-weight:600;}
#tooltip .foot{font-size:12px; line-height:1.65; white-space:pre-line; max-height:38vh; overflow-y:auto; border-top:1px solid rgba(44,35,24,0.18); padding-top:9px;}
#tooltip .foot a{color:var(--indigo); word-break:break-all;}
#tooltip .foot.empty{color:var(--muted); font-style:italic;}
#tooltip .rel{font-size:11px; margin-top:9px; padding-top:9px; border-top:1px solid rgba(44,35,24,0.18); color:#4a3c28;}
#tooltip .rel b{display:block; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:3px;}
#tooltip .close-btn{
  position:absolute; top:8px; right:10px; background:none; border:none; font-size:16px; color:var(--text);
  cursor:pointer; opacity:.5; display:none; font-family:'JetBrains Mono',monospace;
}
#tooltip .close-btn:hover{opacity:1;}

@media (hover:none), (pointer:coarse){
  #tooltip{
    position:fixed; left:0 !important; right:0; bottom:0; top:auto !important; max-width:none;
    border-radius:10px 10px 0 0; border-left:1px solid var(--line-col); border-top:4px solid var(--red-bright);
    max-height:56vh; overflow-y:auto;
  }
  #tooltip .close-btn{display:block;}
}

/* ---------- Legend ---------- */
#legend{
  position:absolute; left:14px; bottom:58px; z-index:30;
  background:var(--surface); border:1px solid var(--line-mid); border-radius:3px; box-shadow:0 4px 14px var(--shadow);
  padding:10px 13px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted);
  display:flex; flex-direction:column; gap:5px; backdrop-filter:blur(4px);
  transition:opacity .2s; max-width:200px;
  max-height:min(320px, calc(100% - 70px)); overflow-y:auto;
}
#legend .lg-title{color:var(--text); font-weight:700; letter-spacing:.05em; margin-bottom:2px;}
#legend .lg-item{display:flex; align-items:center; gap:7px;}
#legend .swatch{width:18px;height:0;border-top-width:2px;border-top-style:solid;flex:none;}
#legend.collapsed .lg-body{display:none;}

#zoom-controls{position:absolute; right:14px; bottom:58px; z-index:30; display:flex; flex-direction:column; gap:1px;}
#zoom-controls .btn{width:32px;height:32px;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:0 4px 14px var(--shadow);}

@media (max-width: 720px){
  header{padding:9px 12px; gap:8px;}
  .title-block{gap:9px;}
  .seal{width:32px;height:32px;}
  h1{font-size:13px;}
  h1 small{display:none;}
  .stats{display:none;}
  .controls-row{width:100%;}
  #search{width:100%;font-size:12px;padding:6px 9px;}
  #legend{max-width:132px; font-size:9px; padding:7px 9px; bottom:54px; gap:4px;}
  #legend .lg-item{gap:5px;}
  #zoom-controls{bottom:54px;}
}
</style>
</head>
